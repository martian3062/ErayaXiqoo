# Machine-specific settings (cache location, temp dir) live in GRADLE_USER_HOME/gradle.properties,
# which overrides this file. On the build laptop that is E:\cache\gradle.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
